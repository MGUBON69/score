<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบประเมินความพึงพอใจ</title>
    <!-- Tailwind CSS ผ่าน CDN สำหรับทำ UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* สไตล์สำหรับปุ่มวิทยุ (Radio Options) เมื่อถูกเลือก */
        .radio-custom:checked + div {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <!-- Container หลักของแบบประเมิน -->
    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-10 w-full max-w-2xl">
        
        <!-- ส่วนที่ 1: โลโก้และหัวข้อ -->
        <div class="text-center mb-8">
            <img src="icon2.png" alt="Company Logo" class="h-36 mx-auto object-contain">
            <h1 class="text-2xl font-bold text-gray-800 mt-4">แบบประเมินความพึงพอใจ</h1>
            <p class="text-gray-500 text-sm mt-2">ความคิดเห็นของคุณมีความสำคัญต่อเราในการพัฒนาบริการให้ดียิ่งขึ้น</p>
        </div>

        <!-- ส่วนที่ 2: ฟอร์มแบบประเมิน -->
        <form id="surveyForm" class="space-y-6">
            
            <!-- ข้อที่ 1: ที่ปรึกษาการขาย -->
            <div>
                <label class="block text-gray-700 font-medium mb-3">1. ความพึงพอใจในการให้บริการของที่ปรึกษาการขาย</label>
                <div class="flex justify-between md:justify-start md:space-x-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="question1" value="1" class="radio-custom hidden" required>
                        <div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">1</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="question1" value="2" class="radio-custom hidden">
                        <div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">2</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="question1" value="3" class="radio-custom hidden">
                        <div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">3</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="question1" value="4" class="radio-custom hidden">
                        <div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">4</div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="question1" value="5" class="radio-custom hidden">
                        <div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">5</div>
                    </label>
                </div>
            </div>

            <!-- ข้อที่ 2: ความพร้อมของตัวรถ -->
            <div>
                <label class="block text-gray-700 font-medium mb-3">2. ความพร้อมของตัวรถก่อนส่งมอบ</label>
                <div class="flex justify-between md:justify-start md:space-x-4">
                    <label class="cursor-pointer"><input type="radio" name="question2" value="1" class="radio-custom hidden" required><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">1</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question2" value="2" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">2</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question2" value="3" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">3</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question2" value="4" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">4</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question2" value="5" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">5</div></label>
                </div>
            </div>

            <!-- ข้อที่ 3: ภาพรวมศูนย์บริการ -->
            <div>
                <label class="block text-gray-700 font-medium mb-3">3. ภาพรวมในการให้บริการ ทั้งฝ่ายขายและศูนย์บริการ</label>
                <div class="flex justify-between md:justify-start md:space-x-4">
                    <label class="cursor-pointer"><input type="radio" name="question3" value="1" class="radio-custom hidden" required><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">1</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question3" value="2" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">2</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question3" value="3" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">3</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question3" value="4" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">4</div></label>
                    <label class="cursor-pointer"><input type="radio" name="question3" value="5" class="radio-custom hidden"><div class="w-10 h-10 md:w-12 md:h-12 border-2 border-gray-300 rounded-full flex items-center justify-center hover:border-blue-400 transition-colors">5</div></label>
                </div>
            </div>

            <!-- ส่วนที่ 3: ช่องข้อเสนอแนะ -->
            <div>
                <label for="comments" class="block text-gray-700 font-medium mb-2">ข้อเสนอแนะเพิ่มเติม (ถ้ามี)</label>
                <textarea id="comments" name="comments" rows="4" class="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition-colors" placeholder="พิมพ์ความคิดเห็นของคุณที่นี่..."></textarea>
            </div>

            <!-- ปุ่ม Submit -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
                <span>ส่งแบบประเมิน</span>
            </button>
        </form>

        <!-- ข้อความแสดงเมื่อส่งข้อมูลสำเร็จ -->
        <div id="successMessage" class="hidden text-center py-8">
            <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <h2 class="text-2xl font-bold text-gray-800">ขอบคุณสำหรับความคิดเห็นค่ะ!</h2>
            <p class="text-gray-500 mt-2">เราจะนำข้อมูลไปพัฒนาบริการให้ดียิ่งขึ้น</p>
        </div>
    </div>

    <!-- ส่วน JavaScript พร้อมระบบตรวจจับ Error ดึงการตอบกลับจาก Server -->
    <script>
        document.getElementById('surveyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            
            // เตรียม Payload ส่งไปยัง SheetDB
            const payloadData = {
                Timestamp: new Date().toLocaleString('th-TH'),
                Q1_Sales: formData.get('question1'),
                Q2_CarPrep: formData.get('question2'),
                Q3_Overall: formData.get('question3'),
                Comments: formData.get('comments') || '-'
            };

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = 'กำลังส่งข้อมูล...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            const API_URL = 'https://sheetdb.io/api/v1/dqzie2gijxg33';

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ data: [payloadData] })
            })
            .then(async (response) => {
                const resData = await response.json().catch(() => ({}));
                
                if (response.ok) {
                    // บันทึกสำเร็จ
                    document.getElementById('surveyForm').classList.add('hidden');
                    document.getElementById('successMessage').classList.remove('hidden');
                } else {
                    // หากเกิด Error ฝั่ง SheetDB ให้ดึงข้อความจาก Server มาโชว์
                    console.error('SheetDB Error Response:', resData);
                    const errorMsg = resData.error || resData.message || 'ไม่สามารถบันทึกข้อมูลได้ (HTTP Status ' + response.status + ')';
                    throw new Error(errorMsg);
                }
            })
            .catch(error => {
                console.error('API Error Details:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message + '\n\nคำแนะนำ: กรุณาเช็กชื่อ Header ใน Google Sheets แถวแรก ให้ตรงกับ Timestamp, Q1_Sales, Q2_CarPrep, Q3_Overall, Comments ค่ะ');
                
                // คืนค่าปุ่มให้กดใหม่ได้
                submitBtn.innerHTML = 'ส่งแบบประเมิน';
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
            });
        });
    </script>
</body>
</html>
